[widget.active_window]
display = "text_only"
enabled = false
max_length = 800

[widget.audio_visualizer]
mirrored = false

[widget.brightness]
show_label = false

[widget.clock]
format = "{:%a %-d %b  %-I:%M %p}"

[widget.control-center]
custom_image = "/home/ongyean/.local/share/icons/MacTahoe/apps/symbolic/tweaks-app-symbolic.svg"
