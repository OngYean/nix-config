[notification]
background_opacity = 0.24999999441206455
filter_order = [ "filter", "filter-2" ]

    [notification.filter.filter]
    allow_permanent = true
    enabled = true
    match = "vlc"
    play_sound = false
    save_history = false
    show_toast = true

    [notification.filter.filter-2]
    allow_permanent = true
    enabled = true
    match = "feralinteractive gamemode"
    play_sound = true
    save_history = false
    show_toast = true

[osd]
background_opacity = 0.24999999441206455

[plugin_settings."icefish/phone-connect"]
details_placement = "floating"

[plugin_settings."icefish/phone-operate"]
max_fps = 120
panel_placement = "widget"
show_device_name = true

[plugin_settings."noctalia/wallhaven"]
browser_placement = "floating"

[plugins]
enabled = [ "noctalia/wallhaven", "icefish/phone-operate" ]

[shell]
corner_radius_scale = 2.0
date_format = "%A, %-d %B"
font_family = "Inter"
launch_apps_as_systemd_services = true
polkit_agent = true
popup_shadows = false
settings_window_translucent = true
time_format = "{:%-I:%M %p}"

    [shell.animation]
    speed = 0.80000001192092896

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    app_grid = false

        [shell.launcher.providers.emoji]
        global = true

    [shell.panel]
    clipboard_position = "auto"
    control_center_placement = "floating"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "top_left"
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true
    size = 20

    [shell.session]
    grid = true
    grid_columns = 1

    [shell.window_switcher]
    mru = true

[theme]
